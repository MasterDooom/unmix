name: Deploy Unmix frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci
      - name: Test frontend
        working-directory: web/frontend
        run: npm test
      - name: Build frontend
        working-directory: web/frontend
        env:
          VITE_BASE: /unmix/
          VITE_API_BASE: ${{ vars.UNMIX_API_BASE || 'https://unmix-api.onrender.com' }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify deployed frontend API
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for public API health
        env:
          API_BASE: ${{ vars.UNMIX_API_BASE || 'https://unmix-api.onrender.com' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --connect-timeout 5 --max-time 15 -fsS "$API_BASE/api/health" -o health.json; then
              break
            fi
            echo "API not ready yet (attempt $attempt/24)"
            sleep 10
          done
          test -s health.json
          python -c 'import json; h=json.load(open("health.json")); assert h.get("status") == "ok", h; assert h.get("api_contract_version") == 2, h; print("API health OK:", h)'
      - name: Verify production CORS preflight
        env:
          API_BASE: ${{ vars.UNMIX_API_BASE || 'https://unmix-api.onrender.com' }}
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 15 -fsS -X OPTIONS "$API_BASE/api/mix-lab/separate" \
            -H 'Origin: https://masterdooom.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -D cors-headers.txt -o /dev/null
          grep -iq '^access-control-allow-origin: https://masterdooom.github.io' cors-headers.txt
          echo "Production origin is allowed by API CORS."
