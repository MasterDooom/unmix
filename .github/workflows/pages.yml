name: Deploy Unmix frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci
      - name: Test frontend
        working-directory: web/frontend
        run: npm test
      - name: Build frontend
        working-directory: web/frontend
        env:
          VITE_BASE: /unmix/
          VITE_API_BASE: ${{ vars.UNMIX_API_BASE || 'https://unmix-api.onrender.com' }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
