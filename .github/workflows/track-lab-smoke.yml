name: track-lab-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/track-lab-smoke.yml"
      - "experiments/track_lab_smoke.py"
      - "web/backend/app/main.py"
      - "web/backend/app/track_lab.py"
      - "web/requirements-track-lab.txt"

permissions:
  contents: read

jobs:
  pretrained-track-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: web/backend:src
      AUDIO_SEPARATOR_MODEL_DIR: ${{ runner.temp }}/unmix-audio-separator-models
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install the actual API and pretrained CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements.txt
          python -m pip install -r web/requirements-track-lab.txt
          python -c "import audio_separator.separator, torch; print('torch:', torch.__version__)"
          mkdir -p "$AUDIO_SEPARATOR_MODEL_DIR"
      - name: Run real model inference through FastAPI and verify downloaded stems
        run: python experiments/track_lab_smoke.py
